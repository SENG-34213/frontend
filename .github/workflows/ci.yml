name: Frontend CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install formatter
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  app:
    name: ${{ matrix.app }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, student, teacher]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  browser:
    name: Browser user flows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            student/package-lock.json
            teacher/package-lock.json
            admin/package-lock.json

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm ci --prefix student
          npm ci --prefix teacher
          npm ci --prefix admin

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser user flows
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
